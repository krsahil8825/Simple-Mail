<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>New Form Submission</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
      font-family: Georgia, &quot;Times New Roman&quot;, serif;
      color: #1a1a2e;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <!-- Outer wrapper -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f0f2f5">
      <tr>
        <td align="center">
          <!-- Email card -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 600px;
              width: 100%;
              background: #ffffff;
              border-radius: 4px;
              overflow: hidden;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            "
          >
            <!-- Header -->
            <tr>
              <td style="background-color: #0f172a; padding: 36px 40px 32px">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td>
                      <div
                        style="
                          display: inline-block;
                          background: #1e3a5f;
                          border-radius: 2px;
                          padding: 4px 10px;
                          margin-bottom: 16px;
                        "
                      >
                        <span
                          style="
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 10px;
                            font-weight: 700;
                            letter-spacing: 0.12em;
                            text-transform: uppercase;
                            color: #94a3b8;
                          "
                          >Contact Form</span
                        >
                      </div>
                      <div
                        style="
                          font-family: Georgia, &quot;Times New Roman&quot;, serif;
                          font-size: 26px;
                          font-weight: 400;
                          color: #f8fafc;
                          line-height: 1.3;
                          margin: 0;
                        "
                      >
                        New Message Received
                      </div>
                    </td>
                    <td align="right" valign="top">
                      <div
                        style="
                          width: 44px;
                          height: 44px;
                          background: linear-gradient(135deg, #2563eb, #3b82f6);
                          border-radius: 50%;
                          display: inline-block;
                          text-align: center;
                          line-height: 44px;
                          font-size: 20px;
                        "
                      >
                        ✉
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Accent bar -->
            <tr>
              <td
                style="
                  background: linear-gradient(90deg, #2563eb 0%, #3b82f6 50%, #0f172a 100%);
                  height: 3px;
                  font-size: 0;
                  line-height: 0;
                "
              >
                &nbsp;
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 36px 40px 28px">
                <p
                  style="
                    margin: 0 0 28px;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 14px;
                    color: #64748b;
                    line-height: 1.6;
                  "
                >
                  Someone submitted your contact form. Here are the details:
                </p>

                <!-- Name field -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 20px">
                  <tr>
                    <td
                      style="border-left: 3px solid #2563eb; padding: 14px 20px; background: #f8fafc; border-radius: 0 4px 4px 0"
                    >
                      <div
                        style="
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 10px;
                          font-weight: 700;
                          letter-spacing: 0.1em;
                          text-transform: uppercase;
                          color: #94a3b8;
                          margin-bottom: 6px;
                        "
                      >
                        Name
                      </div>
                      <div
                        style="
                          font-family: Georgia, &quot;Times New Roman&quot;, serif;
                          font-size: 17px;
                          color: #0f172a;
                          line-height: 1.4;
                        "
                      >
                        {{ name }}
                      </div>
                    </td>
                  </tr>
                </table>

                <!-- Email field -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 20px">
                  <tr>
                    <td
                      style="border-left: 3px solid #2563eb; padding: 14px 20px; background: #f8fafc; border-radius: 0 4px 4px 0"
                    >
                      <div
                        style="
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 10px;
                          font-weight: 700;
                          letter-spacing: 0.1em;
                          text-transform: uppercase;
                          color: #94a3b8;
                          margin-bottom: 6px;
                        "
                      >
                        Email Address
                      </div>
                      <div style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: #2563eb; line-height: 1.4">
                        {{ email }}
                      </div>
                    </td>
                  </tr>
                </table>

                <!-- Message field -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 8px">
                  <tr>
                    <td
                      style="border-left: 3px solid #2563eb; padding: 14px 20px; background: #f8fafc; border-radius: 0 4px 4px 0"
                    >
                      <div
                        style="
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 10px;
                          font-weight: 700;
                          letter-spacing: 0.1em;
                          text-transform: uppercase;
                          color: #94a3b8;
                          margin-bottom: 10px;
                        "
                      >
                        Message
                      </div>
                      <div
                        style="
                          font-family: Georgia, &quot;Times New Roman&quot;, serif;
                          font-size: 15px;
                          color: #1e293b;
                          line-height: 1.8;
                        "
                      >
                        {{ message | safe }}
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Reply CTA -->
            <tr>
              <td style="padding: 0 40px 36px">
                <table cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="background: #2563eb; border-radius: 4px; padding: 12px 24px">
                      <a
                        href="mailto:{{ email }}"
                        style="
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 13px;
                          font-weight: 700;
                          color: #ffffff;
                          text-decoration: none;
                          letter-spacing: 0.04em;
                        "
                        >Reply to {{ name }} →</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding: 0 40px">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="border-top: 1px solid #e2e8f0; font-size: 0; line-height: 0">&nbsp;</td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding: 20px 40px 28px">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td>
                      <p
                        style="
                          margin: 0;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 12px;
                          color: #94a3b8;
                          line-height: 1.6;
                        "
                      >
                        This notification was sent from your website contact form at
                        <a href="https://krsahil.co.in" style="color: #2563eb; text-decoration: none">krsahil.co.in</a>
                      </p>
                    </td>
                    <td align="right">
                      <img
                        src="https://krsahil.co.in/site/favicon.png"
                        alt="KS Logo"
                        width="32"
                        height="32"
                        style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #cbd5e1"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!-- /Email card -->
        </td>
      </tr>
    </table>
  </body>
</html>
