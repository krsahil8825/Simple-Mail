<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thank You</title>
    </head>

    <body style="margin:0;padding:0;background-color:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
        <div style="max-width:640px;margin:0 auto;padding:32px 16px;">
            <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,0.08);">
                <div style="background:linear-gradient(135deg,#0f172a,#2563eb);padding:20px 24px;color:#ffffff;">
                    <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.85;">Contact Form</div>
                    <h1 style="margin:8px 0 0;font-size:22px;line-height:1.2;">Thank you for contacting Me</h1>
                </div>

                <div style="padding:24px 28px;color:#111827;font-size:16px;line-height:1.7;">
                    <p style="margin:0 0 12px;">Hi {{ name }},</p>
                    <p style="margin:0 0 18px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:16px;">{{ message_text }}</p>
                    <p style="margin:18px 0 0;">Best regards,<br />Kumar Sahil</p>
                </div>
            </div>

            <hr style="border:none;border-top:1px solid #e5e7eb;margin:20px 0;" />
            <p style="margin:12px 0 0;text-align:center;font-size:12px;color:#94a3b8;">Visit my website: <a href="https://krsahil.co.in" target="_blank" style="color:#2563eb;text-decoration:underline;">krsahil.co.in</a></p>
        </div>
    </body>

</html>
